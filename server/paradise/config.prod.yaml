# Paradise Agent — production config overlay.
# Loaded only when PARADISE_MODE=prod (see server/paradise/factory.py).
# Dev mode (main branch) reads nothing from this file.

mode: prod

# Set false to keep main-branch 4-phase loop; true routes through LangGraph (Phase 2)
# Phase 2.5: enables INTENT node + conditional routing (chitchat → RESPOND fast path)
langgraph_enabled: true

# Phase 2.9: routes through supervisor graph (intent → mode-select →
# subgraph via Handoff Protocol → reflect → cleanup). Takes precedence
# over langgraph_enabled. Disable to fall back to the 4-phase loop.
supervisor_enabled: true

# LLM (override per-deployment via env var)
llm:
  provider: ollama
  model: qwen2.5:7b
  api_url: http://ollama:11434
  temperature: 0.7
  max_tokens: 2048

tool_llm:
  provider: ollama
  model: qwen2.5:3b
  api_url: http://ollama:11434
  temperature: 0.3
  max_tokens: 1024

# Ingress (Phase 1)
ingress:
  api_keys:
    - "${PARADISE_API_KEYS}"
  rate_limit_per_minute: 60
  cost_budget_per_request_usd: 0.05

# Transport resilience (Phase 3)
resilience:
  max_retries: 3
  retry_backoff_max_seconds: 10
  circuit_failure_threshold: 3
  circuit_recovery_seconds: 30

# Sandbox privilege rings (Phase 4)
sandbox:
  admin_tools_enabled: false  # admin tools rejected by default
  subprocess_timeout_seconds: 30
  subprocess_memory_limit_mb: 256

# Memory stack (Phase 5)
memory:
  redis_url: "${REDIS_URL}"
  qdrant_url: "${QDRANT_URL}"
  session_ttl_seconds: 1800
  similarity_threshold: 0.92

# Postgres for LangGraph checkpointer (Phase 2)
checkpointer:
  backend: postgres  # postgres | sqlite
  postgres_dsn: "${POSTGRES_DSN}"

# Observability (Phase 6)
observability:
  otlp_endpoint: http://otel-collector:4317
  log_level: INFO

# ── AgentTeam 编排 (Phase 6) ──────────────────────────────────────────
# 复杂查询自动路由到多 agent 协作（compose→execute→synthesize）。
# 开启后，复杂度判定为 complex 的 turn 走 agent_team 而非 plan_execute。
agent_team:
  enabled: true
  max_agents: 4
  default_agent_mode: chat

# ── Bash tool (Phase 3-A) ─────────────────────────────────────────────
# Replaces the coarse 'bash' tool from builtin.py with two privilege-
# separated tools: bash_read (allowlist) + bash_write (blocklist + ulimit).
bash:
  enabled: true
  read_timeout_seconds: 10
  write_timeout_seconds: 30
  write_memory_limit_mb: 256
  sandbox_root: ""             # empty = reuse tools/sandbox.SANDBOX_ROOT
  full_access: false           # true disables cwd lock (dev only, never prod)

# ── MCP integration (Phase 3-B) ───────────────────────────────────────
# Default OFF. When enabled, build_supervisor starts a McpClientManager
# that spawns each configured server (stdio/sse/http), lists its tools,
# and registers them into the global ToolRegistry with prefix
# `mcp.{server_name}.{tool_name}`.
mcp:
  enabled: false
  servers:
    - name: filesystem
      command: npx
      args: ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
      env: {}
      transport: stdio
      timeout_seconds: 60
      connect_timeout_seconds: 30
    # ── Examples (uncomment + configure to enable) ───────────────────
    # - name: github
    #   command: npx
    #   args: ["-y", "@modelcontextprotocol/server-github"]
