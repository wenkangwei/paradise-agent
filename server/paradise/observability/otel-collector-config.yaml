# OTel collector config — receives OTLP, exposes Prometheus scrape target.
# Used by docker-compose.yml otel-collector service.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 1000

exporters:
  # Expose scraped metrics at :8889/metrics for Prometheus to scrape
  prometheus:
    endpoint: 0.0.0.0:8889
  # Log all spans to stdout for local debugging
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, debug]
